<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Insulina</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #00796b;
            font-size: 28px;
        }

        label {
            font-size: 16px;
            color: #004d40;
            display: block;
            margin-bottom: 6px;
            margin-top: 12px;
        }

        input[type="number"], select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 2px solid #b2dfdb;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus, select:focus {
            border-color: #00796b;
            outline: none;
        }

        button {
            background-color: #00796b;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #004d40;
        }

        .result, .formula, .warning {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
        }

        .result {
            background-color: #e0f2f1;
            color: #004d40;
            border: 2px solid #004d40;
            text-align: center;
        }

        .formula {
            background-color: #f4f4f4;
            color: #333;
            border: 1px solid #ddd;
            font-family: monospace;
        }

        .warning {
            background-color: #ffebee;
            color: #d32f2f;
            border: 2px solid #d32f2f;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kalkulator Insulina</h1>

    <label for="tdid">Ukupan dnevni insulin (TDID):</label>
    <input type="number" id="tdid" placeholder="Unesite ukupan dnevni insulin (jedinice)" step="1" value="54">

    <label for="target">Ciljani šećer (mmol/L):</label>
    <input type="number" id="target" placeholder="Unesite ciljani šećer" step="0.1" value="6">

    <label for="current">Trenutni šećer (mmol/L):</label>
    <input type="number" id="current" placeholder="Unesite trenutni šećer" step="0.1">

    <label for="carbs">Grami ugljenih hidrata:</label>
    <input type="number" id="carbs" placeholder="Unesite grame ugljenih hidrata" step="1">

    <label for="sensitivity">Osjetljivost na insulin:</label>
    <input type="number" id="sensitivity" placeholder="Unesite osjetljivost (npr. 2)" step="0.01">

    <button onclick="calculateInsulin()">Izračunaj</button>

    <div id="result" class="result" style="display: none;"></div>
    <div id="formula" class="formula" style="display: none;"></div>
    <div id="warning" class="warning" style="display: none;"></div>
</div>

<script>
    function calculateInsulin() {
        const tdid = parseFloat(document.getElementById('tdid').value);
        const current = parseFloat(document.getElementById('current').value);
        const target = parseFloat(document.getElementById('target').value);
        const carbs = parseFloat(document.getElementById('carbs').value);
        const sensitivity = parseFloat(document.getElementById('sensitivity').value);

        // Provera unetih vrednosti
        if (isNaN(tdid) || isNaN(current) || isNaN(target) || isNaN(carbs) || isNaN(sensitivity)) {
            alert("Molimo vas da unesete sve vrednosti!");
            return;
        }

        // Novi način izračunavanja prema vašim zahtevima
        const icr = 500 / tdid; // Insulin-to-Carb Ratio
        const carbInsulin = carbs / icr; // Insulin za ugljene hidrate
        const correction = (current - target) / sensitivity; // Korekcija za trenutni šećer

        // Ukupna doza insulina
        const totalInsulin = carbInsulin + correction;

        // Prikaz rezultata
        const resultElement = document.getElementById('result');
        resultElement.style.display = 'block';
        resultElement.textContent = `Ukupna doza insulina: ${totalInsulin.toFixed(2)} jedinica`;

        // Prikaz formule
        const formulaElement = document.getElementById('formula');
        formulaElement.style.display = 'block';
        formulaElement.innerHTML = `
            <b>Formula za izračunavanje:</b><br>
            ICR = 500 / ${tdid} = ${icr.toFixed(2)}<br>
            Insulin za ugljene hidrate: ${carbs} / ${icr.toFixed(2)} = ${carbInsulin.toFixed(2)}<br>
            Korekcija: (${current} - ${target}) / ${sensitivity} = ${correction.toFixed(2)}<br>
            Ukupno: ${carbInsulin.toFixed(2)} + ${correction.toFixed(2)} = ${totalInsulin.toFixed(2)}
        `;
    }
</script>

</body>
</html>
