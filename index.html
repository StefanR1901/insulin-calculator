<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Insulina</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #00796b;
            font-size: 28px;
        }

        label {
            font-size: 16px;
            color: #004d40;
            display: block;
            margin-bottom: 6px;
            margin-top: 12px;
        }

        input[type="number"], select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 2px solid #b2dfdb;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus, select:focus {
            border-color: #00796b;
            outline: none;
        }

        button {
            background-color: #00796b;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #004d40;
        }

        .result, .formula, .warning, .direction {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
        }

        .result {
            background-color: #e0f2f1;
            color: #004d40;
            border: 2px solid #004d40;
            text-align: center;
        }

        .formula {
            background-color: #f4f4f4;
            color: #333;
            border: 1px solid #ddd;
            font-family: monospace;
        }

        .warning {
            background-color: #ffebee;
            color: #d32f2f;
            border: 2px solid #d32f2f;
            font-weight: bold;
            text-align: center;
        }

        .direction {
            font-size: 30px;
            color: #00796b;
            text-align: center;
        }

        /* Responzivnost za manje uređaje */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }

            input[type="number"], select, button {
                font-size: 14px;
                padding: 8px;
            }

            .result, .formula, .warning, .direction {
                font-size: 16px;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            input[type="number"], select, button {
                font-size: 14px;
                padding: 6px;
            }

            .result, .formula, .warning, .direction {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kalkulator Insulina</h1>

    <label for="tdid">Ukupan dnevni insulin (TDID):</label>
    <input type="number" id="tdid" placeholder="Unesite ukupan dnevni insulin (jedinice)" step="1" value="54">

 

    <label for="target">Ciljani šećer (mmol/L):</label>
    <input type="number" id="target" placeholder="Unesite ciljani šećer" step="0.1" value="5">

    <label for="current">Trenutni šećer (mmol/L):</label>
    <input type="number" id="current" placeholder="Unesite trenutni šećer" step="0.1">

    <div id="direction" class="direction"></div>

    <label for="carbs">Grami ugljenih hidrata:</label>
    <input type="number" id="carbs" placeholder="Unesite grame ugljenih hidrata" step="1">

    <label for="sensitivity">Osjetljivost na insulin:</label>
    <input type="number" id="sensitivity" placeholder="Unesite osjetljivost (npr. 2)" step="0.01">

    <button onclick="calculateInsulin()">Izračunaj</button>

    <div id="result" class="result" style="display: none;"></div>
    <div id="formula" class="formula" style="display: none;"></div>
    <div id="warning" class="warning" style="display: none;"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        async function fetchCurrentSugar() {
            try {
                const response = await fetch('https://marijana.info/api/v1/entries.json?svg');
                const data = await response.json();
                
                const latestEntry = data[0];
                const sugarMgDl = latestEntry.sgv;
                const direction = latestEntry.direction;
                const sugarMmolL = sugarMgDl / 18.0182;
                
                document.getElementById('current').value = sugarMmolL.toFixed(1);

                const directionElement = document.getElementById('direction');
                let directionSymbol;
                switch (direction) {
                    case 'Flat':
                        directionSymbol = '→';
                        break;
                    case 'SingleUp':
                        directionSymbol = '↑';
                        break;
                    case 'DoubleUp':
                        directionSymbol = '↑↑';
                        break;
                    case 'SingleDown':
                        directionSymbol = '↓';
                        break;
                    case 'DoubleDown':
                        directionSymbol = '↓↓';
                        break;
                    default:
                        directionSymbol = '';
                }

                directionElement.textContent = `Smer kretanja šećera: ${directionSymbol}`;
            } catch (error) {
                console.error('Greška prilikom preuzimanja podataka:', error);
            }
        }

        fetchCurrentSugar();
    });

    function calculateInsulin() {
        const tdid = parseFloat(document.getElementById('tdid').value);
        const mealType = document.getElementById('mealType').value;
        const current = parseFloat(document.getElementById('current').value);
        const target = parseFloat(document.getElementById('target').value);
        const carbs = parseFloat(document.getElementById('carbs').value);
        const sensitivity = parseFloat(document.getElementById('sensitivity').value);

        if (isNaN(tdid) || isNaN(current) || isNaN(target) || isNaN(carbs) || isNaN(sensitivity)) {
            alert("Molimo vas da unesete sve vrednosti!");
            return;
        }

        const icr = 500 / tdid;
        const carbInsulin = carbs / icr;
        const correction = (current - target) 
        const totalInsulin = carbInsulin + correction;

        const resultElement = document.getElementById('result');
        resultElement.style.display = 'block';
        resultElement.textContent = `Ukupna doza insulina: ${totalInsulin.toFixed(2)} jedinica`;

        const formulaElement = document.getElementById('formula');
        formulaElement.style.display = 'block';
        formulaElement.innerHTML = `
            <b>Formula za izračunavanje:</b><br>
            ICR = 500 / ${tdid} = ${icr.toFixed(2)}<br>
            Insulin za ugljene hidrate: ${carbs} / ${icr.toFixed(2)} = ${carbInsulin.toFixed(2)}<br>
            Korekcija: (${current} - ${target})  = ${correction.toFixed(2)}<br>
            Ukupno: ${carbInsulin.toFixed(2)} + ${correction.toFixed(2)} = ${totalInsulin.toFixed(2)}
        `;
    }
</script>

</body>
</html>
